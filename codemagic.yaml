workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    scripts:
      - name: Build APK
        script: |
          cd LauncherRadio/LauncherRadio || cd LauncherRadio || true
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
